plugins {
    id 'java'
    id 'application'
}

application {
    mainClass = 'org.main.ServerMain'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.4'
}

// Упрощенная конфигурация jar
jar {
    manifest {
        attributes(
                'Main-Class': 'org.main.ServerMain'  // прямое указание класса
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}