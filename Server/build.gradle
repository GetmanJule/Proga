apply plugin: 'java'
apply plugin: 'application'

mainClassName = 'org.main.ServerMain'

dependencies {
    // Добавь зависимости при необходимости
}


// Генерация runnable jar
jar {
    manifest {
        attributes(
                'Main-Class': mainClassName
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
